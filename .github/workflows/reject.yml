name: Reject

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Draft id from the Discord preview, like 20261027-0200-ab12"
        required: true

permissions:
  contents: write

concurrency:
  group: agent-queue
  cancel-in-progress: false

jobs:
  reject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Reject draft
        env:
          DRAFT_ID: ${{ inputs.id }}
        run: python -m agent.main reject "$DRAFT_ID"
      - name: Save queue changes
        run: |
          git config user.name "social-agent"
          git config user.email "social-agent@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "reject draft" && git pull --rebase && git push)
